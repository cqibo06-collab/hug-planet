<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抱抱星球 · 网页桌宠</title>
<style>
  :root{
    --mint:#7ed6c4; --mint-dark:#3aa896; --bg1:#0f2430; --bg2:#1a3c4a;
    --line:rgba(255,255,255,.12); --ink:#eaf6f3; --sub:#9db8b3;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 50% 20%, var(--bg2), var(--bg1) 70%);
    color:var(--ink); overflow:hidden; user-select:none;
  }
  /* ---------- 星空背景 ---------- */
  .stars i{position:fixed; background:#fff; border-radius:50%; opacity:.5; animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}

  /* ---------- 顶栏 ---------- */
  header{position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:10px;
    padding:12px 16px; z-index:20}
  header .tt{font-weight:700; letter-spacing:.5px}
  header a{color:var(--mint); text-decoration:none; font-size:13px}
  header .sp{flex:1}
  header .hint{font-size:12px; color:var(--sub)}

  /* ---------- 桌宠本体 ---------- */
  #stage{position:fixed; inset:0; z-index:5}
  #pet{position:absolute; left:50%; top:58%; width:150px; height:150px; margin:-75px 0 0 -75px;
    cursor:grab; touch-action:none; z-index:10}
  #pet:active{cursor:grabbing}
  .planet{position:relative; width:130px; height:130px; margin:10px auto 0; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #b8efe2, var(--mint) 55%, var(--mint-dark) 100%);
    box-shadow:0 14px 40px rgba(0,0,0,.35), inset -8px -12px 24px rgba(0,0,0,.12);
    animation:breathe 14s ease-in-out infinite; transition:transform .8s ease}
  @keyframes breathe{ /* 4 秒吸气 · 4 秒停住 · 6 秒呼气 */
    0%{transform:scale(1)} 28.5%{transform:scale(1.07)} 57%{transform:scale(1.07)} 100%{transform:scale(1)}}
  .ring{position:absolute; left:50%; top:50%; width:196px; height:58px; margin:-29px 0 0 -98px;
    border:6px solid rgba(255,255,255,.35); border-radius:50%;
    transform:rotate(-16deg); pointer-events:none}
  .ring::after{content:""; position:absolute; inset:-6px; border-radius:50%;
    border:6px solid transparent; border-top-color:rgba(255,255,255,.12); transform:rotate(8deg)}
  .face{position:absolute; inset:0}
  .eye{position:absolute; top:52px; width:14px; height:18px; border-radius:8px; background:#23433d;
    animation:blink 5.2s infinite}
  .eye.l{left:36px} .eye.r{right:36px}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)}}
  .blush{position:absolute; top:74px; width:16px; height:8px; border-radius:50%;
    background:rgba(255,150,150,.55)}
  .blush.l{left:28px} .blush.r{right:28px}
  .mouth{position:absolute; left:50%; top:82px; width:22px; height:11px; margin-left:-11px;
    border:3px solid #23433d; border-top:none; border-radius:0 0 22px 22px}
  /* 委屈状态：30 分钟没人理 */
  #pet.lonely .mouth{height:5px; border:3px solid #23433d; border-bottom:none;
    border-radius:22px 22px 0 0; top:86px}
  #pet.lonely .eye{height:10px; top:56px}
  #pet.lonely .planet{filter:saturate(.7) brightness(.92)}
  .shadow{position:absolute; left:50%; bottom:-16px; width:100px; height:16px; margin-left:-50px;
    background:radial-gradient(closest-side, rgba(0,0,0,.4), transparent)}

  /* 气泡 */
  #bubble{position:absolute; left:50%; bottom:170px; transform:translateX(-50%) translateY(6px);
    max-width:min(78vw, 340px); background:rgba(255,255,255,.96); color:#1d3a35;
    padding:12px 16px; border-radius:16px 16px 16px 4px; font-size:14.5px; line-height:1.7;
    box-shadow:0 10px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:15}
  #bubble.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #bubble b{display:block; margin-bottom:4px}

  /* 飘心 */
  .heart{position:fixed; z-index:30; font-size:20px; pointer-events:none;
    animation:floatUp 1.1s ease-out forwards}
  @keyframes floatUp{
    from{transform:translate(-50%,0) scale(.7); opacity:1}
    to{transform:translate(-50%,-90px) scale(1.25); opacity:0}}

  /* ---------- 底部菜单 ---------- */
  nav{position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center;
    flex-wrap:wrap; padding:14px 10px calc(14px + env(safe-area-inset-bottom)); z-index:20}
  nav button{
    background:rgba(255,255,255,.09); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:9px 15px; font-size:14px; cursor:pointer; backdrop-filter:blur(6px)}
  nav button:hover{background:rgba(255,255,255,.16)}
  nav button.on{background:var(--mint); color:#0e2b26; border-color:transparent; font-weight:700}

  /* ---------- 面板 ---------- */
  #panel{position:fixed; left:50%; bottom:86px; transform:translateX(-50%);
    width:min(92vw, 480px); max-height:min(62vh, 480px); overflow:auto;
    background:rgba(16,38,46,.96); border:1px solid var(--line); border-radius:18px;
    padding:18px; display:none; z-index:25; box-shadow:0 20px 60px rgba(0,0,0,.45)}
  #panel.show{display:block}
  #panel h3{font-size:16px; margin-bottom:10px}
  #panel .moods{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  #panel .moods button{background:rgba(255,255,255,.08); border:1px solid var(--line);
    color:var(--ink); border-radius:12px; padding:10px 4px; font-size:14px; cursor:pointer}
  #panel .moods button:hover{background:rgba(255,255,255,.16)}
  #panel textarea{width:100%; min-height:90px; background:rgba(255,255,255,.07);
    border:1px solid var(--line); border-radius:12px; color:var(--ink); padding:10px;
    font:inherit; resize:vertical}
  #panel .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center}
  #panel .btn{background:var(--mint); color:#0e2b26; border:none; border-radius:10px;
    padding:9px 16px; font-weight:700; cursor:pointer; font-size:14px}
  #panel .btn.ghost{background:rgba(255,255,255,.1); color:var(--ink); font-weight:400}
  #panel .note{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.6}
  #panel .stat{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  #panel .stat .card{background:rgba(255,255,255,.07); border:1px solid var(--line);
    border-radius:12px; padding:12px}
  #panel .stat b{font-size:22px; display:block}
  #panel .stat span{font-size:12px; color:var(--sub)}
  #panel ul{list-style:none; margin-top:8px}
  #panel li{background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; margin-bottom:8px; font-size:13.5px; line-height:1.6; white-space:pre-wrap}
  #panel li i{float:right; font-style:normal; color:var(--sub); font-size:12px; cursor:pointer}
  /* 呼吸引导 */
  #breath{position:fixed; inset:0; display:none; place-items:center; z-index:40;
    background:rgba(8,20,26,.75)}
  #breath.show{display:grid}
  #breath .box{text-align:center}
  #breath .ball{width:120px; height:120px; margin:0 auto 20px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #b8efe2, var(--mint) 55%, var(--mint-dark));
    transition:transform 4s ease; box-shadow:0 0 60px rgba(126,214,196,.4)}
  #breath .tip{font-size:20px; letter-spacing:2px}
  #breath .cnt{color:var(--sub); font-size:13px; margin-top:10px}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<header>
  <span class="tt">🪐 抱抱星球 · 网页桌宠</span>
  <span class="sp"></span>
  <a href="../">← 回主站</a>
</header>

<div id="stage"><div id="pet">
  <div class="planet">
    <div class="ring"></div>
    <div class="face">
      <span class="eye l"></span><span class="eye r"></span>
      <span class="blush l"></span><span class="blush r"></span>
      <span class="mouth"></span>
    </div>
  </div>
  <div class="shadow"></div>
</div></div>

<div id="bubble"></div>

<div id="panel"></div>

<div id="breath"><div class="box">
  <div class="ball" id="bball"></div>
  <div class="tip" id="btip">准备好了吗</div>
  <div class="cnt" id="bcnt"></div>
</div></div>

<nav>
  <button data-act="hug">🫂 抱抱</button>
  <button data-act="warm">💬 悄悄话</button>
  <button data-act="mood">🌡️ 心情签到</button>
  <button data-act="breath">🫁 呼吸练习</button>
  <button data-act="notes">🕳️ 树洞</button>
  <button data-act="stats">📊 陪伴记录</button>
</nav>

<script>
/* ============ 抱抱星球 · 网页桌宠 ============
   复用主站 app.js 的世界观文案（MOODS / WARM_WORDS）。
   数据只存本浏览器 localStorage（key: hugpet_web_v1）。 */
"use strict";

/* ---------- 文案（与主站一致） ---------- */
const MOODS = {
  happy:  { emoji:"😊", label:"开心",  title:"开心也要好好收藏哦",
    msgs:["真好呀！把今天的快乐存起来，难过的时候拿出来晒一晒。","快乐会传染，愿你把这份好心情分给身边的人。","世界因为你今天的笑容，都可爱了一点点。","趁开心，去吃点喜欢的东西，把甜度拉满。"] },
  sad:    { emoji:"😢", label:"难过",  title:"难过的话，就先停一停吧",
    msgs:["难过的时候不必急着好起来。情绪像天气，会来，也会走。","你已经很努力了，允许自己今天软弱一小会儿。","哭一哭也没关系，眼泪是在帮心里做大扫除。","你不是不够好，你只是累了。先抱抱自己。"] },
  anxious:{ emoji:"😰", label:"焦虑",  title:"深呼吸，你此刻是安全的",
    msgs:["你担心的事，大多数永远不会发生。先回到此刻。","把大象切成小块，一次只吃一口就好。","焦虑是大脑在努力保护你。谢谢它，然后告诉它：现在可以放松了。","不要想整座山，只想脚下这一步。"] },
  tired:  { emoji:"😫", label:"疲惫",  title:"累的话，就好好歇一歇",
    msgs:["你已经走了很远，先坐下来歇歇脚吧。","世界不会因为你休息一会儿就塌下来，真的。","你不需要时刻满分，会累的你也很可爱。","先睡一觉，很多难题睡醒之后会变小的。"] },
  angry:  { emoji:"😠", label:"生气",  title:"生气没有错，先照顾好自己",
    msgs:["生气说明你在乎自己，这很正常。","先让心里的火苗降一降温，再决定要不要说话。","深呼吸三次。你不是要赢，你是想舒服一点。","值得生气的事会过去，别让它偷走你一整天。"] },
  lost:   { emoji:"🧭", label:"迷茫",  title:"迷茫是雾，雾会散的",
    msgs:["看不清远方的时候，就把眼前的路走稳。","迷茫说明你在寻找，寻找的人总会遇到答案。","不必急着找到人生方向，先找到今晚吃什么就好。","你不需要现在就知道所有答案。"] },
};
const WARM_WORDS = [
  "你不需要发光发热才有价值，你本身就很珍贵。","慢慢来，比较快。","今天的你，已经做得足够好了。",
  "世界偶尔冷淡，但总有一盏灯为你留着。","允许一切发生，也允许自己偶尔掉线。","你比你想象中，更勇敢、也更能干。",
  "星星不会因为一次乌云就熄灭，你也一样。","生活会有糖的，再等等看。","照顾好自己，是最温柔的英雄主义。",
  "你走过的每一步，都算数。","累了就休息，不是放弃，是充电。","你的存在本身，就是一件值得开心的事。",
  "把日子过成自己喜欢的样子，哪怕慢一点。","你已经熬过了很多难熬的日子，这次也可以。","不必羡慕别人的花，你的种子正在发芽。",
  "眼泪流完之后，记得抬头看看天空。","这世界上，总有人在偷偷爱着你。","今天的晚霞很美，明天的你也是。",
  "抱抱自己，说一句：辛苦了。","别急，月亮也是慢慢亮起来的。","有些路走得慢，是因为它通往更远的地方。",
  "对自己温柔一点，你只是个普通人，已经很了不起了。","生活偶尔褪色，但你自带光芒。","好好吃饭，好好睡觉，好运正在路上。",
  "你值得被好好对待，从你自己开始。","每朵花都有自己的花期，不用和别人比。",
];
const HUG_WORDS = [
  "收到你的抱抱啦，+1 个温暖已存入。","被你抱住的星球，亮度提升了 1%。","抱抱充电中……请勿松手。",
  "这个抱抱我记下了，等你难过的时候还给你。",
];
const LONELY_WORDS = [
  "好久没有人理我了……屏幕前的你，还好吗？","我一个人挂在银河里好久了，给个抱抱好不好。",
  "悄悄蹲在这里等你很久啦。",
];

/* ---------- 存取 ---------- */
const KEY = "hugpet_web_v1";
const DEF = { hugs:0, moods:[], notes:[], first:Date.now(), last:Date.now(), pos:null };
let DB = DEF;
try { DB = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save(){ DB.last = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = s => document.querySelector(s);

/* ---------- 星空 ---------- */
(() => {
  let html = "";
  for (let i = 0; i < 60; i++){
    const s = (Math.random() * 2 + 1).toFixed(1);
    html += `<i style="left:${(Math.random()*100).toFixed(1)}vw;top:${(Math.random()*100).toFixed(1)}vh;`
      + `width:${s}px;height:${s}px;animation-delay:${(Math.random()*3).toFixed(1)}s"></i>`;
  }
  $("#stars").innerHTML = html;
})();

/* ---------- 气泡 ---------- */
let bubbleTimer = null;
function say(text, ms){
  const b = $("#bubble");
  b.innerHTML = text;
  b.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove("show"), ms || 3600);
}

/* ---------- 抱抱 ---------- */
function floatHeart(x, y){
  const h = document.createElement("span");
  h.className = "heart";
  h.textContent = pick(["💗","💖","💚","✨"]);
  h.style.left = x + "px"; h.style.top = y + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 1100);
}
let lastClick = 0;
function hug(ev){
  DB.hugs++;
  save();
  wake();
  const r = $("#pet").getBoundingClientRect();
  for (let i = 0; i < 3; i++){
    setTimeout(() => floatHeart(
      (ev && ev.clientX || r.left + r.width/2) + (Math.random()*60 - 30),
      (ev && ev.clientY || r.top) - 10 - Math.random()*20), i * 120);
  }
  // 双击（350ms 内两次抱抱）→ 悄悄话
  const now = Date.now();
  if (now - lastClick < 350) say(pick(WARM_WORDS), 4200);
  else say(pick(HUG_WORDS) + `<br><span style="color:#7aa39b;font-size:12px">累计抱抱 ${DB.hugs} 次</span>`, 2600);
  lastClick = now;
}

/* ---------- 互动时间 / 委屈状态 ---------- */
function wake(){ $("#pet").classList.remove("lonely"); }
function checkLonely(){
  if (Date.now() - DB.last > 30 * 60 * 1000){
    if (!$("#pet").classList.contains("lonely")){
      $("#pet").classList.add("lonely");
      say(pick(LONELY_WORDS), 4200);
    }
  }
}
setInterval(checkLonely, 60 * 1000);

/* ---------- 拖动 + 点按 ---------- */
(() => {
  const pet = $("#pet");
  let sx = 0, sy = 0, ox = 0, oy = 0, moved = false, dragging = false;
  pet.addEventListener("pointerdown", e => {
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    const r = pet.getBoundingClientRect();
    ox = r.left + r.width/2; oy = r.top + r.height/2;
    pet.setPointerCapture(e.pointerId);
  });
  pet.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    if (moved){
      pet.style.left = (ox + dx) + "px";
      pet.style.top  = (oy + dy) + "px";
      pet.style.margin = "-75px 0 0 -75px";
    }
  });
  pet.addEventListener("pointerup", e => {
    dragging = false;
    if (moved){
      DB.pos = { x: pet.style.left, y: pet.style.top };
      save();
    } else hug(e);
  });
  // 恢复上次位置
  if (DB.pos){ pet.style.left = DB.pos.x; pet.style.top = DB.pos.y; pet.style.margin = "-75px 0 0 -75px"; }
})();

/* ---------- 面板 ---------- */
function openPanel(html){
  const p = $("#panel");
  p.innerHTML = html;
  p.classList.add("show");
}
function closePanel(){ $("#panel").classList.remove("show"); }
document.addEventListener("pointerdown", e => {
  const p = $("#panel");
  if (p.classList.contains("show") && !p.contains(e.target) && !e.target.closest("nav") && !e.target.closest("#pet"))
    closePanel();
});

function panelMood(){
  openPanel(`<h3>今天的心情是……</h3><div class="moods">
    ${Object.keys(MOODS).map(k => `<button data-m="${k}">${MOODS[k].emoji} ${MOODS[k].label}</button>`).join("")}
  </div><div class="note">签到会记进陪伴记录，星球会回你一句对应的话。</div>`);
  $$("#panel [data-m]").forEach(b => b.onclick = () => {
    const m = MOODS[b.dataset.m];
    DB.moods.unshift({ m: b.dataset.m, ts: Date.now() });
    DB.moods = DB.moods.slice(0, 200);
    save(); wake();
    openPanel(`<h3>${m.emoji} ${m.title}</h3>
      <div style="line-height:1.9">${esc(pick(m.msgs))}</div>
      <div class="row"><button class="btn ghost" onclick="panelMood()">← 换一个心情</button></div>`);
  });
}
function panelNotes(){
  openPanel(`<h3>🕳️ 树洞</h3>
    <textarea id="ntext" placeholder="说出来吧，只有这颗星球和这台浏览器知道。"></textarea>
    <div class="row"><button class="btn" id="nsave">存进树洞</button>
    <span class="note" style="margin:0">共 ${DB.notes.length} 条 · 只存本机</span></div>
    ${DB.notes.length ? `<ul>${DB.notes.slice(0, 20).map((n, i) =>
      `<li>${esc(n.text)}<i data-del="${i}">删</i><br><small style="color:#9db8b3">${new Date(n.ts).toLocaleString()}</small></li>`).join("")}</ul>` : ""}
    <div class="note">树洞的话没有 AI 回复——有些话写下来就够了。</div>`);
  $("#nsave").onclick = () => {
    const v = $("#ntext").value.trim();
    if (!v) return;
    DB.notes.unshift({ text: v.slice(0, 500), ts: Date.now() });
    DB.notes = DB.notes.slice(0, 100);
    save(); wake(); panelNotes();
  };
  $$("#panel [data-del]").forEach(b => b.onclick = () => {
    DB.notes.splice(+b.dataset.del, 1); save(); panelNotes();
  });
}
function panelStats(){
  const days = Math.max(1, Math.ceil((Date.now() - DB.first) / 86400000));
  const moodCnt = {};
  DB.moods.forEach(x => moodCnt[x.m] = (moodCnt[x.m] || 0) + 1);
  const topMood = Object.keys(moodCnt).sort((a,b) => moodCnt[b] - moodCnt[a])[0];
  openPanel(`<h3>📊 陪伴记录</h3><div class="stat">
    <div class="card"><b>${DB.hugs}</b><span>累计抱抱</span></div>
    <div class="card"><b>${days}</b><span>在一起第几天</span></div>
    <div class="card"><b>${DB.moods.length}</b><span>心情签到次数${topMood ? " · 最近常是 " + MOODS[topMood].label : ""}</span></div>
    <div class="card"><b>${DB.notes.length}</b><span>树洞里的话</span></div>
  </div>
  <div class="note">初次见面：${new Date(DB.first).toLocaleString()} · 最近互动：${new Date(DB.last).toLocaleString()}<br>
  所有数据只存在这台浏览器的 localStorage 里，清浏览器数据会消失。</div>`);
}

/* ---------- 呼吸练习（4-4-6，跟着球） ---------- */
async function breath(){
  const ROUNDS = 3;
  $("#breath").classList.add("show");
  const ball = $("#bball"), tip = $("#btip"), cnt = $("#bcnt");
  const wait = ms => new Promise(r => setTimeout(r, ms));
  for (let r = 1; r <= ROUNDS; r++){
    cnt.textContent = `第 ${r} / ${ROUNDS} 轮`;
    tip.textContent = "吸——气";
    ball.style.transitionDuration = "4s"; ball.style.transform = "scale(1.45)";
    await wait(4000);
    tip.textContent = "停——住";
    ball.style.transitionDuration = "4s";
    await wait(4000);
    tip.textContent = "呼——气";
    ball.style.transitionDuration = "6s"; ball.style.transform = "scale(1)";
    await wait(6000);
  }
  tip.textContent = "做完啦 🎉";
  cnt.textContent = "感觉怎么样？";
  await wait(1600);
  $("#breath").classList.remove("show");
  ball.style.transitionDuration = "0.8s";
  say("跟着做完一轮呼吸，心跳会慢下来一点。做得很棒。", 4200);
  save();
}

/* ---------- 菜单 ---------- */
$$nav();
function $$nav(){
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
    wake();
    const act = b.dataset.act;
    if (act === "hug")   { closePanel(); hug(); }
    if (act === "warm")  { closePanel(); say(pick(WARM_WORDS), 5000); }
    if (act === "mood")  panelMood();
    if (act === "notes") panelNotes();
    if (act === "stats") panelStats();
    if (act === "breath"){ closePanel(); breath(); }
  });
}
